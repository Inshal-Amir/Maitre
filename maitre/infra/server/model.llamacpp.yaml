# Model engine "llamacpp" (default): llama.cpp server with a GGUF MoE model.
# Attention and shared layers stay on the GPU; --fit moves the expert weights that do not fit into system RAM.
# Selected by MAITRE_ENGINE=llamacpp in server.env (common.sh adds this file to every compose call).
services:
  model:
    restart: unless-stopped
    image: ghcr.io/ggml-org/llama.cpp:${LLAMACPP_IMAGE_TAG:-server-cuda-v0.4.1}
    volumes:
      - ${MAITRE_MODEL_DIR:?set MAITRE_MODEL_DIR in server.env}:/models:ro
    command: >
      --model /models/${MAITRE_MODEL_SUBDIR:?set MAITRE_MODEL_SUBDIR}/${MAITRE_MODEL_FILE:?set MAITRE_MODEL_FILE}
      --alias maitre-upstream
      --ctx-size ${MAITRE_MAX_MODEL_LEN:-65536}
      --parallel ${MAITRE_MAX_NUM_SEQS:-1}
      --fit on
      --flash-attn on
      --jinja
      --reasoning ${MAITRE_REASONING:-on}
      --temp ${MAITRE_TEMPERATURE:-0.6} --top-p ${MAITRE_TOP_P:-0.95} --top-k 20 --min-p 0
      --no-mmproj
      --no-webui
      ${MAITRE_LLAMACPP_EXTRA_ARGS:-}
      --api-key-file /run/secrets/vllm_api_key
      --host 0.0.0.0 --port 8000
    secrets: [vllm_api_key]
    networks: [internal]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      retries: 90
      start_period: 120s
